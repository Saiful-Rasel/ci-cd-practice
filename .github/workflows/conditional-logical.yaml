
name: Value Pass Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Enter your name'
        required: true
        default: 'unnamed'
        type: string

jobs:
  get-value-workflow:
    runs-on: ubuntu-latest

    outputs:
      greeting: ${{ steps.generate.outputs.greeting }}

    steps:
      - name: Generate Greeting Message
        id: generate
        run: |
          echo "greeting=Hello ${{ inputs.name }}" >> "$GITHUB_OUTPUT"

  print-value-workflow:
    runs-on: ubuntu-latest
    needs: get-value-workflow

    steps:
      - name: Print Greeting Message
        run: |
          echo "${{ needs.get-value-workflow.outputs.greeting }}"





