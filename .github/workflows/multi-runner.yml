
name: Multi Runner Practice

# Workflow will execute on push to main or manual trigger.
on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # Job 1: Execute on GitHub's infrastructure.
  github-runner:
    name: GitHub Hosted Runner
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Print Welcome Message
        run: echo "Hello from GitHub Hosted Runner!"

      - name: Show Machine Information
        run: |
          echo "Runner: GitHub Hosted"
          echo "Operating System:"
          uname -a

      - name: Show Working Directory
        run: pwd

  # Job 2: Execute on your local Ubuntu machine.
  self-hosted-runner:
    name: Self Hosted Runner
    runs-on: self-hosted

    timeout-minutes: 5

    steps:
      - name: Print Welcome Message
        run: echo "Hello from Saiful's Ubuntu Runner!"

      - name: Show Machine Information
        run: |
          echo "Runner: Self Hosted"
          echo "Hostname:"
          hostname

      - name: Show Current User dlsf
        run: whoami 

      - name: Show Operating System
        run: uname -a
